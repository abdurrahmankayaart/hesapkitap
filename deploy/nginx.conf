# abdurrahmankaya.com/takip altında yayın. Traefik /takip önekini silerek de silmeden de gönderse çalışır.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  types {
    text/html html;
    application/javascript js;
    application/manifest+json webmanifest;
    image/svg+xml svg;
    image/png png;
  }

  rewrite ^/takip/?(.*)$ /$1;

  # Veri adrese bağlı: www ile açılırsa kayıtlar ayrı düşer, tek adrese topla.
  if ($host = www.abdurrahmankaya.com) {
    return 301 https://abdurrahmankaya.com/takip$uri$is_args$args;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(png|svg)$ {
    add_header Cache-Control "public, max-age=604800";
  }
}
