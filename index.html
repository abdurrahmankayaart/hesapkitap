<body>
<!-- APP START -->
<title>Hesap Kitap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3EDE4; --surface:#FBF8F3; --surface-2:#EAE0D3; --ink:#212C46; --ink-2:#4A5063; --muted:#6E685C; --line:#E0D5C6;
  --accent:#212C46; --on-accent:#FBF8F3; --accent-soft:#E4E1DA; --ring:#A66540;
  --teak:#A66540; --on-teak:#FFFFFF; --canvas:#D4C4B0;
  --in:#606A5F; --out:#932C2E; --save:#A66540;
  --good:#4E594D; --good-soft:#E1E4DC; --warn:#8A4F2E; --warn-soft:#F1E1D2; --bad:#932C2E; --bad-soft:#F3DEDA;
  --grid:#E6DCCF; --axis:#C9BCAB; --shadow:0 1px 2px rgba(33,44,70,.06),0 8px 22px rgba(33,44,70,.07); --scrim:rgba(20,26,41,.45);
  --tint:13%; --tint-2:24%;
  --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F18; --surface:#151C2C; --surface-2:#1E273B; --ink:#F1EADF; --ink-2:#D4C4B0; --muted:#A39A8C; --line:#252F46;
    --accent:#D9956A; --on-accent:#212C46; --accent-soft:#3D2F2A; --ring:#D9956A;
    --teak:#C27A4E; --on-teak:#FFFFFF; --canvas:#D4C4B0;
    --in:#9CAA99; --out:#D9605F; --save:#D9956A;
    --good:#A9B8A5; --good-soft:#26302A; --warn:#D9956A; --warn-soft:#3A2B22; --bad:#E07372; --bad-soft:#3A1E22;
    --grid:#1E273B; --axis:#33405F; --shadow:0 1px 2px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.7);
    --tint:18%; --tint-2:30%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F18; --surface:#151C2C; --surface-2:#1E273B; --ink:#F1EADF; --ink-2:#D4C4B0; --muted:#A39A8C; --line:#252F46;
  --accent:#D9956A; --on-accent:#212C46; --accent-soft:#3D2F2A; --ring:#D9956A;
  --teak:#C27A4E; --on-teak:#FFFFFF; --canvas:#D4C4B0;
  --in:#9CAA99; --out:#D9605F; --save:#D9956A;
  --good:#A9B8A5; --good-soft:#26302A; --warn:#D9956A; --warn-soft:#3A2B22; --bad:#E07372; --bad-soft:#3A1E22;
  --grid:#1E273B; --axis:#33405F; --shadow:0 1px 2px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.7);
  --tint:18%; --tint-2:30%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);overscroll-behavior-y:none}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45;padding-inline:16px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:10px}
.app{max-width:560px;margin-inline:auto;padding-bottom:128px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.025em;white-space:nowrap;min-width:0}
.brand svg{width:28px;height:28px}
.month{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:30px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.month span{min-width:84px;text-align:center;font-weight:700;font-size:13.5px;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}

#view{display:flex;flex-direction:column;gap:18px}
#view.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h .sub{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--ink-2)}
.hint{font-size:13px;color:var(--muted);margin:0}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}

/* category tint */
[style*="--c"]{--c-bg:color-mix(in srgb,var(--c) var(--tint),var(--surface));--c-bub:color-mix(in srgb,var(--c) var(--tint-2),var(--surface));--c-ink:color-mix(in srgb,var(--c) 72%,var(--ink))}
.i{display:inline-block;vertical-align:-4px;flex:none}
.bub{width:38px;height:38px;border-radius:13px;background:var(--c-bub,var(--surface-2));color:var(--c-ink,var(--ink-2));display:grid;place-items:center;font-size:19px;flex:none}

/* hero */
.hero{padding-top:4px}
.hello{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;color:var(--ink-2);font-size:15px}
.streak{background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:12.5px;border-radius:99px;padding:3px 10px}
.big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.02;letter-spacing:-.03em;margin-top:10px}
.big.neg{color:var(--bad)}
.hero .sub{color:var(--muted);font-size:14px;margin-top:2px}
.split{display:flex;gap:3px;height:12px;margin-top:16px}
.split i{display:block;height:100%;border-radius:6px;min-width:0}
.split-l{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.split-l span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.io .card{padding:12px 14px;border-radius:18px}
.io small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:600}
.io b{display:block;font-family:var(--display);font-size:21px;font-weight:700;margin-top:2px}
.io em{font-style:normal;font-size:12px;color:var(--muted)}

/* quick text */
.qin{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:5px 5px 5px 14px;box-shadow:var(--shadow)}
.qin:focus-within{border-color:var(--accent)}
.qin input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:8px 0;outline:none}
.qin input::placeholder{color:var(--muted)}
.qbtn{border:0;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.qbtn.go{background:var(--accent);color:var(--on-accent)}
.qbtn.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 20%,transparent)}}
.qprev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:13px}
.qprev:empty{display:none}
.qprev .tag{background:var(--c-bg,var(--surface-2));border-radius:99px;padding:4px 10px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.qprev .tag.amt{background:var(--ink);color:var(--bg)}
.qhelp{font-size:12.5px;color:var(--muted);margin-top:8px}

/* templates */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.qchip{flex:none;border:0;background:var(--c-bg);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:96px;text-align:left;scroll-snap-align:start;transition:transform .12s}
.qchip:active{transform:scale(.95)}
.qchip .ic{font-size:22px;line-height:1;color:var(--c-ink)}
.qchip b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap}
.qchip small{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap}
.qchip.add{background:none;border:1.5px dashed var(--line);color:var(--ink-2);font-weight:700;font-size:13px;justify-content:center;align-items:center}

/* budget ring card */
.ringcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring span{position:absolute;font-family:var(--display);font-weight:800;font-size:15px}
.ringcard .v{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.ringcard .s{color:var(--muted);font-size:13px}

/* goals strip */
.gmini{flex:none;width:156px;border:0;background:var(--c-bg);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.gmini .top2{display:flex;justify-content:space-between;align-items:center}
.gmini b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmini small{font-size:12px;color:var(--ink-2)}
.gmini .bar{height:6px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.gmini .bar i{background:var(--c)}

/* fixed + lists */
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:700;font-size:14.5px}
.li .m{font-size:12.5px;color:var(--muted)}
.li.done .t{color:var(--muted)}
.li-main{grid-column:1/3;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left;min-width:0;border-radius:12px}
.check{color:var(--good);font-weight:700;font-size:13px}

/* category grid */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{border:0;background:var(--c-bg);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard .h{display:flex;justify-content:space-between;align-items:flex-start}
.ccard .pct{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface);border-radius:99px;padding:2px 8px}
.ccard .n{font-size:13px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .a{font-family:var(--display);font-size:19px;font-weight:700;margin-top:-4px}
.ccard .bar{height:6px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.ccard .bl{font-size:11.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.more{grid-column:1/-1}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:14px;height:0;border-top:2px dashed var(--ink-2);display:inline-block}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));box-shadow:var(--shadow)}

.cta{display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:left;background:var(--ink);color:var(--bg);border-radius:22px;padding:16px}
.cta .ic{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--bg) 14%,transparent);display:grid;place-items:center;flex:none}
.cta b{display:block;font-family:var(--display);font-size:17px}
.cta small{opacity:.75;font-size:13px}
.cta svg{margin-left:auto;flex:none}

.banner{background:var(--warn-soft);border-radius:20px;padding:14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.banner b{color:var(--warn)}

/* list view */
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;font-size:16px}
.inp:focus{outline:2px solid var(--ring);outline-offset:0;border-color:transparent}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg-b{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg-b[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1/.92;border:0;border-radius:11px;background:color-mix(in srgb,var(--out) var(--h,0%),var(--surface-2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;color:var(--ink);min-width:0}
.cal button b{font-size:13px;line-height:1.1}
.cal button.hot b{color:#fff}
.calwrap{display:flex;flex-direction:column;gap:14px}
.cal button.fut{opacity:.45}
.cal button.today b{text-decoration:underline;text-underline-offset:2px}
.cal button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cal-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal-sum small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.cal-sum b{font-family:var(--display);font-size:17px}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.05em}
.txg{border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.txw{position:relative;background:var(--bad);border-bottom:1px solid var(--line)}
.txw:last-child{border-bottom:0}
.txw .del{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#fff;font-weight:700;font-size:13px}
.tx{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:var(--surface);padding:11px 14px;text-align:left;touch-action:pan-y}
.tx .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;font-size:15px;text-align:right;font-family:var(--display)}
.tx .a.in{color:var(--good)}
.tx .badge{font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border-radius:6px;padding:1px 6px;margin-left:6px}

/* budget view */
.bud{display:grid;grid-template-columns:auto 1fr 118px;gap:8px 12px;align-items:center;padding-block:11px;border-top:1px solid var(--line)}
.bud:first-child{border-top:0}
.bud .n{font-weight:700;font-size:14.5px}
.bud .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bud .bar{grid-column:2/-1;height:6px}
.money-in{position:relative}
.money-in input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 10px 9px 24px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.money-in::before{content:"₺";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}

/* goals view */
.goal{background:var(--c-bg);border:0;display:flex;flex-direction:column;gap:10px}
.goal .gt{display:flex;gap:12px;align-items:center}
.goal .gt .bub{background:var(--surface);width:46px;height:46px;font-size:24px;border-radius:15px}
.goal .gt .m{font-size:12.5px;color:var(--ink-2)}
.goal .ga{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.goal .ga small{font-size:15px;color:var(--ink-2);font-weight:600}
.goal .bar{height:10px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.goal .bar i{background:var(--c)}
.goal .plan{font-size:13px;color:var(--ink-2)}
.goal .btn{background:var(--surface);border-color:transparent}

/* settings */
.set-i{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.set-i:first-child{border-top:0}
.set-i .t{font-weight:700;font-size:14.5px}
.set-i .m{font-size:12.5px;color:var(--muted)}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prof{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}

textarea.inp{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;height:64px;padding-inline:8px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding-block:6px;-webkit-user-select:none;user-select:none}
.nav a svg{width:23px;height:23px;transition:transform .15s}
.nav a[aria-current="page"]{color:var(--accent)}
.nav a[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
.fab{justify-self:center;width:60px;height:60px;border-radius:22px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transform:translateY(-16px);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .15s}
.fab:active{transform:translateY(-16px) scale(.94)}
.fab svg{width:28px;height:28px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
.grabzone{position:sticky;top:0;z-index:2;background:var(--surface);padding:10px 0 4px;touch-action:none;cursor:grab;display:flex;flex-direction:column;gap:10px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:3px;flex:1;max-width:240px}
.toggle button{border:0;background:none;border-radius:11px;padding:8px;font-weight:700;font-size:14px;color:var(--ink-2)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:99px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.amt{font-family:var(--display);font-weight:800;font-size:46px;text-align:center;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.amt.zero{color:var(--muted)}
.amt.gelir{color:var(--good)}
.amt-sub{text-align:center;font-size:13px;color:var(--muted);margin-top:-8px;min-height:18px}
.catgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:78px;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.catgrid::-webkit-scrollbar{display:none}
.catb{border:2px solid transparent;background:var(--c-bg);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink-2);text-align:center;line-height:1.15}
.catb .ic{font-size:22px;line-height:1;color:var(--c-ink)}
.catb[aria-pressed="true"]{border-color:var(--c);color:var(--ink)}
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.datepick{position:relative;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.datepick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.opts .datepick input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer}
.opts input[type=date],.opts select{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{border:0;background:var(--surface-2);border-radius:16px;height:52px;font-size:23px;font-weight:700;font-family:var(--display);transition:transform .08s,background .08s}
.keypad button:active{transform:scale(.95);background:var(--line)}
.save{height:54px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px}
.save-row{display:flex;gap:8px}
.save-row .save{flex:1}
.err{color:var(--bad);font-size:13px;font-weight:700}
.err:empty{display:none}
.cb{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.cb input{width:18px;height:18px;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}

/* report */
.rp-big{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-grid>div{background:var(--surface-2);border-radius:16px;padding:10px 12px}
.rp-grid small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.rp-grid b{font-family:var(--display);font-size:18px}
.rp-list{display:flex;flex-direction:column;gap:8px}
.rp-item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.rp-item .bar{grid-column:2/-1;height:6px}
.tipbox{background:var(--accent-soft);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tipbox p{margin:0;display:flex;gap:8px}

.mbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:150px}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mb .col{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.mb i{display:block;width:100%;max-width:34px;background:var(--c);border-radius:8px 8px 3px 3px;min-height:2px}
.mb span{font-size:11px;color:var(--ink-2);font-weight:700;min-height:15px}
.mb small{font-size:11px;color:var(--muted)}

.lock{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lock-in{width:100%;max-width:320px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.lock-in svg{width:56px;height:56px}
.dots{display:flex;gap:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.lock .keypad{width:100%}
.tag-auto{font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:16px;display:grid;place-items:center;flex:none}
.avatar-btn{border:0;background:none;padding:0;border-radius:50%;flex:none}
.avatar-btn[aria-pressed="true"] .avatar{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.hello-name{font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.15}
.hello-date{font-size:13.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.welcome{position:fixed;inset:0;z-index:57;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.welcome.out{animation:wout .45s ease forwards}
@keyframes wout{to{opacity:0;visibility:hidden}}
.w-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;margin-block:auto}
.w-hi{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.02;letter-spacing:-.035em}
.w-hi span{display:block;color:var(--accent)}
.w-hi.anim{animation:rise .5s cubic-bezier(.2,.9,.25,1) both}
.w-hi.anim span{animation:rise .6s .12s cubic-bezier(.2,.9,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.w-sub{color:var(--ink-2);font-size:15.5px;margin:0}
.brandmark svg{width:52px;height:52px}
.w-opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;text-align:left}
.w-opt b{display:block;font-size:15px}
.w-opt small{color:var(--muted);font-size:13px}
.people{display:flex;flex-direction:column;gap:10px}
.person{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:12px 16px;font-size:17px;font-weight:700;text-align:left}
.person .avatar{width:46px;height:46px;font-size:19px}
.tdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tchip{border:0;border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.tchip.sug{background:var(--surface-2);color:var(--ink-2)}
.taginp{border:1px dashed var(--axis);background:none;border-radius:99px;padding:5px 10px;font-size:14px;width:120px}
.receipt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:34px}
.receipt img{width:46px;height:46px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.ttag{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}
.rems{display:flex;flex-direction:column;gap:6px}
.rem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 6px 8px 12px;font-size:14px}
.rem>span{flex:1;min-width:0}
.rem .tdot{margin-top:0}
.rem-x{border:0;background:none;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:9px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:14px;padding:3px}
.tabs button{border:0;background:none;border-radius:11px;padding:8px 4px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.duo small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.duo b{font-family:var(--display);font-size:21px}
.debt .top3{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt .left{font-family:var(--display);font-size:22px;font-weight:800}
.photo-full{width:100%;border-radius:14px;display:block}
.tour-art{width:88px;height:88px;border-radius:26px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tour-dots{display:flex;gap:6px}
.tour-dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .2s}
.tour-dots i.on{width:22px;background:var(--accent)}
.yr-nav{display:flex;align-items:center;gap:8px}
.yr-nav button{border:1px solid var(--line);background:var(--surface);border-radius:99px;width:32px;height:32px;display:grid;place-items:center;color:var(--ink-2)}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;-webkit-user-select:none;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .i{transition:transform .2s;color:var(--muted)}
details.fold[open]>summary .i{transform:rotate(180deg)}
.fold-b{margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 12px 11px 16px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);width:max-content;animation:toastin .25s cubic-bezier(.2,.9,.25,1)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}}
.toast button{border:0;background:none;color:var(--accent);font-weight:800;white-space:nowrap}
.confetti{position:fixed;z-index:95;left:50%;top:40%;width:8px;height:13px;border-radius:2px;pointer-events:none;animation:burst 1.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* ================= quick text (typing / voice) ================= */
const GELIR_RE = /(maaş|maas|gelir|prim|ikramiye|harçlık|harclik|avans|temettü|burs|proje ödemesi)/;
const FILLER = new Set(['için','harcadım','ödedim','aldım','verdim','yaptım','tl','lira','₺','bir','de','da','ile','olarak']);
const AYLOW = AY.map(a => trLow(a));
const GUNLOW = GUN.map(g => trLow(g));
function parseQuick(text) {
  const raw = String(text || '').trim();
  let s = ' ' + trLow(raw).replace(/₺/g, ' ₺ ').replace(/(\d)(tl|lira)\b/g, '$1 ') + ' ';
  const now = new Date(), r = {amount: 0, type: raw.startsWith('+') ? 'gelir' : 'gider', date: todayStr(), dateLabel: 'Bugün', method: null, inst: 1, note: '', cat: null, tags: []};
  s = s.replace(/^\s\+/, ' ');
  s = s.replace(/#([\p{L}\d_-]+)/gu, (_, t) => { const n = normTag(t); if (n && !r.tags.includes(n)) r.tags.push(n); return ' '; });
  const cut = m => { s = s.replace(m, ' '); };
  const setD = (d, label) => { r.date = dstr(d); r.dateLabel = label; };
  let m;
  if ((m = s.match(/\s(\d{1,2})\s*(taksit|taksitle|ay taksit)\s/))) { r.inst = Math.min(36, Math.max(1, +m[1])); cut(m[0]); }
  if ((m = s.match(/\s(nakit|elden)\s/))) { r.method = 'nakit'; cut(m[0]); }
  if ((m = s.match(/\s(kredi kartıyla|kredi kartı|kartla|kart)\s/))) { r.method = 'kart'; cut(m[0]); }
  if ((m = s.match(/\s(\d{1,2})\s(gün|gun)\s(önce|once)\s/)) && +m[1] >= 1) { setD(new Date(now.getFullYear(), now.getMonth(), now.getDate() - +m[1]), `${+m[1]} gün önce`); cut(m[0]); }
  else if ((m = s.match(/\s(evvelsi gün|önceki gün)\s/))) { setD(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 2), 'Önceki gün'); cut(m[0]); }
  else if ((m = s.match(/\s(dün|dun)\s/))) { setD(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1), 'Dün'); cut(m[0]); }
  else if ((m = s.match(/\s(bugün|bugun)\s/))) cut(m[0]);
  else if ((m = s.match(/\s(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?\s/)) && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31) {
    const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : now.getFullYear();
    setD(new Date(y, +m[2] - 1, Math.min(+m[1], daysIn(y, +m[2] - 1))), `${+m[1]} ${AY[+m[2] - 1]}`); cut(m[0]);
  }
  else if ((m = s.match(new RegExp('\\s(\\d{1,2})\\s(' + AYLOW.join('|') + ')\\s'))) && +m[1] >= 1 && +m[1] <= 31) {
    const mi = AYLOW.indexOf(m[2]); setD(new Date(now.getFullYear(), mi, Math.min(+m[1], daysIn(now.getFullYear(), mi))), `${+m[1]} ${AY[mi]}`); cut(m[0]);
  }
  else if ((m = s.match(/\s(geçen\s)?(pazartesi|salı|çarşamba|perşembe|cuma|cumartesi|pazar günü)\s/))) {
    const idx = GUNLOW.indexOf(m[2].replace(' günü', '')); let diff = (now.getDay() - idx + 7) % 7; if (m[1] && diff === 0) diff = 7;
    setD(new Date(now.getFullYear(), now.getMonth(), now.getDate() - diff), diff === 0 ? 'Bugün' : GUN[idx]); cut(m[0]);
  }
  if ((m = s.match(/\s(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d{1,3}(?:,\d{3})+(?!\d)|\d+(?:,\d{1,2})?|\d+\.\d{1,2})\s*(bin|k)?(?=\s)/))) {
    r.amount = Math.round(parseAmount(m[1]) * (m[2] ? 1000 : 1) * 100) / 100; cut(m[0]);
  }
  const words = s.split(/\s+/).filter(w => w && !FILLER.has(w));
  r.note = cap(words.join(' '));
  const ln = trLow(r.note);
  if (GELIR_RE.test(ln)) r.type = 'gelir';
  const own = catList(r.type).concat(catList(r.type === 'gelir' ? 'gider' : 'gelir'));
  let c = ln && own.find(c => ln.includes(trLow(c.name)) || trLow(c.name).split(/[ &-]/).some(w => w.length >= 4 && ln.includes(w)));
  if (!c && ln) { const prev = [...S.tx].reverse().find(t => t.note && trLow(t.note) === ln); if (prev) c = catById(prev.cat); }
  if (!c && ln) c = guessCat(ln, r.type);
  if (c) { if (c.type !== r.type && c.type === 'gelir') r.type = 'gelir'; if (c.type === r.type) r.cat = c.id; }
  if (r.type === 'gelir') r.inst = 1;
  return r;
}

    [{k: 'amount', label: `Miktar (${UNITS[g.unit || 'TRY'].name})`, t: 'num', ph: dir > 0 ? 'örn. 2000' : 'Ne kadar çekiyorsun?'}, {k: 'date', label: 'Tarih', t: 'date'}],
    {date: defaultDate()},
    v => { if (!(v.amount > 0)) return 'Tutarı gir.';
      if (dir < 0 && v.amount > goalSaved(g)) return `Bu hedefte en fazla ${fmtU(goalSaved(g), g.unit)} var.`;
      const before = goalSaved(g), dep = {id: uid(), date: v.date || todayStr(), amount: dir * v.amount};
      g.deposits.push(dep); save(); render(); buzz(12);
      if (dir > 0 && before < g.target && goalSaved(g) >= g.target) { confetti(); toast(`“${g.name}” hedefine ulaştın. Tebrikler!`); }
      else toast(dir > 0 ? `${fmtU(v.amount, g.unit)} ${g.name} hedefine eklendi` : `${fmtU(v.amount, g.unit)} çekildi`, {label: 'Geri al', fn: () => { g.deposits = g.deposits.filter(x => x !== dep); save(); render(); }});
    });
}
function confetti() {
  for (let i = 0; i < 30; i++) { const s = document.createElement('span'); s.className = 'confetti'; s.style.background = PALETTE[i % PALETTE.length];
    s.style.setProperty('--dx', (Math.random() * 320 - 160) + 'px'); s.style.setProperty('--dy', (Math.random() * -260 - 40) + 'px'); s.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200); }
  buzz([20, 40, 20]);
}

let rMode = 'ay', rYear = null;
const rTabs = () => `<div class="tabs" style="grid-template-columns:1fr 1fr" role="group" aria-label="Rapor türü"><button type="button" data-rmode="ay" aria-pressed="${rMode === 'ay'}">Aylık</button><button type="button" data-rmode="yil" aria-pressed="${rMode === 'yil'}">Yıllık</button></div>`;
function openReport() {
  if (rMode === 'yil') return openYear();
  const y = cur.y, m = cur.m, txs = monthTx(y, m), pd = new Date(y, m - 1, 1), ptx = monthTx(pd.getFullYear(), pd.getMonth());
  const inc = sum(txs, 'gelir'), exp = sum(txs, 'gider'), pexp = sum(ptx, 'gider'), sav = monthSaved(y, m);
  const gid = txs.filter(t => t.type === 'gider');
  const by = arr => { const o = {}; arr.filter(t => t.type === 'gider').forEach(t => o[t.cat] = (o[t.cat] || 0) + t.amount); return o; };
  const cm = by(txs), pm = by(ptx);
  const top = Object.entries(cm).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const deltas = Object.keys({...cm, ...pm}).map(k => [k, (cm[k] || 0) - (pm[k] || 0)]).sort((a, b) => b[1] - a[1]);
  const up = deltas[0] && deltas[0][1] > 0 ? deltas[0] : null, down = deltas.length && deltas[deltas.length - 1][1] < 0 ? deltas[deltas.length - 1] : null;
  const biggest = [...gid].sort((a, b) => b.amount - a.amount)[0];
  const wd = Array(7).fill(0), wc = Array(7).fill(0);
  gid.filter(t => !t.fixedId && !t.inst).forEach(t => wd[parseD(t.date).getDay()] += t.amount);
  const dim = daysIn(y, m), lastDay = (y === now0.getFullYear() && m === now0.getMonth()) ? now0.getDate() : dim;
  for (let d = 1; d <= lastDay; d++) wc[new Date(y, m, d).getDay()]++;
  const wAvg = wd.map((v, i) => wc[i] ? v / wc[i] : 0), bestDay = wAvg.indexOf(Math.max(...wAvg));
  const fixedSum = sum(gid.filter(t => t.fixedId || t.inst)), varSum = exp - fixedSum;
  const small = gid.filter(t => t.amount < 200 && !t.fixedId), smallSum = sum(small);
  const overs = Object.entries(cm).filter(([k, v]) => S.budgets.cats[k] && v > S.budgets.cats[k]);
  const subs = sum(gid.filter(t => t.cat === 'abonelik'));
  const nd = new Date(y, m + 1, 1), nk = mkey(nd.getFullYear(), nd.getMonth()), nextInst = sum(S.tx.filter(t => t.inst && t.date.slice(0, 7) === nk));
  const rate = inc ? pctOf(inc - exp - sav, inc) : 0;
  const tips = [];
  if (up && up[1] >= 300 && pm[up[0]]) tips.push(['warn', `${catById(up[0]).name} geçen aya göre ${money(up[1])} (%${pctOf(up[1], pm[up[0]])}) arttı. Gelecek ay bu kaleme bir tavan koymayı dene.`]);
  overs.forEach(([k, v]) => tips.push(['bad', `${catById(k).name} bütçesini ${money(v - S.budgets.cats[k])} aştı.`]));
  if (small.length >= 8) tips.push(['warn', `₺200'ün altındaki ${small.length} küçük harcama toplam ${money(smallSum)} etti. Küçükler birikince büyüyor.`]);
  if (inc && rate < 10) tips.push(['warn', `Bu ay gelirinden elinde kalan oran %${Math.max(0, rate)}. Maaş yatınca ${money(Math.round(inc * .1))} (gelirin onda biri) hemen bir hedefe aktarmayı dene.`]);
  else if (inc && rate >= 20) tips.push(['good', `Bu ay gelirinden elinde kalan oran %${rate}. ${S.goals.length ? 'Bir kısmını hedeflerine aktarabilirsin.' : 'Bir birikim hedefi koymanın tam zamanı.'}`]);
  if (subs > 0) tips.push(['axis', `Abonelikler bu ay ${money(subs)}, yılda ${money(subs * 12)} ediyor. Kullanmadığın var mı?`]);
  if (nextInst > 0) tips.push(['axis', `Gelecek ay ${money(nextInst)} taksit ödemen var; bütçeni buna göre ayarla.`]);
  if (down && pm[down[0]]) tips.push(['good', `${catById(down[0]).name} kaleminde geçen aya göre ${money(-down[1])} daha az harcadın.`]);

  const sug = suggestedBudgets();
  openModal(`<div class="grabzone"><div class="grab"></div><div class="sheet-h"><div><div class="eyebrow">${AY[m]} ${y} raporu</div><h2 style="font-size:22px">${ME.name ? esc(ME.name) + ', ' : ''}${AY[m]} böyle geçti</h2></div><button type="button" class="x" data-mclose aria-label="Kapat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
    ${rTabs()}
    <div><div class="hint">Toplam harcama</div><div class="rp-big num">${money(exp)}</div>${pexp ? `<div class="hint num">${AY[pd.getMonth()]} ayına göre ${exp >= pexp ? '▲' : '▼'} %${Math.abs(pctOf(exp - pexp, pexp))} (${money(exp - pexp, true)})</div>` : ''}</div>
    <div class="rp-grid">
      <div><small>Gelir</small><b class="num">${money(inc)}</b></div><div><small>Elde kalan</small><b class="num">${money(inc - exp - sav)}</b></div>
      <div><small>Birikime giden</small><b class="num">${money(sav)}</b></div><div><small>Tasarruf oranı</small><b class="num">%${Math.max(0, rate)}</b></div>

    </div>

    <button type="button" class="btn" data-mclose>Kapat</button>`);
}

function openYear() {
  const y = rYear || cur.y, list = [];
  for (let m = 0; m < 12; m++) { const t = monthTx(y, m); list.push({y, m, inc: incOf(t), exp: sum(t, 'gider'), n: t.length}); }
  const act = list.filter(o => o.n), inc = act.reduce((a, o) => a + o.inc, 0), exp = act.reduce((a, o) => a + o.exp, 0), net = inc - exp;
  const worst = [...act].sort((a, b) => b.exp - a.exp)[0], best = [...act].filter(o => o.inc).sort((a, b) => (b.inc - b.exp) - (a.inc - a.exp))[0];
  const yt = S.tx.filter(t => t.date.slice(0, 4) === String(y) && t.type === 'gider'), cm = {};
  yt.forEach(t => cm[t.cat] = (cm[t.cat] || 0) + t.amount);
  const top = Object.entries(cm).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const saved = S.goals.reduce((a, g) => a + g.deposits.filter(d => d.date.slice(0, 4) === String(y)).reduce((x, d) => x + d.amount, 0) * rate(g.unit), 0);

    ${rTabs()}
    ${act.length ? `<div class="rp-grid">
      <div><small>Toplam gelir</small><b class="num">${money(inc)}</b></div><div><small>Toplam gider</small><b class="num">${money(exp)}</b></div>
      <div><small>Yıl sonu farkı</small><b class="num" style="color:${net < 0 ? 'var(--bad)' : 'var(--good)'}">${money(net, true)}</b></div><div><small>Tasarruf oranı</small><b class="num">%${inc ? Math.max(0, pctOf(net, inc)) : 0}</b></div>

function draggable(panel, close) {

  const up = () => { if (!d) return; const dy = d.dy; d = null; panel.style.transition = 'transform .22s'; if (dy > 110) { panel.style.transform = 'translateY(100%)'; setTimeout(() => { close(); panel.style.transition = ''; panel.style.transform = ''; }, 200); } else { panel.style.transform = ''; setTimeout(() => { panel.style.transition = ''; }, 230); } };

const LN = NATIVE && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications || null;
const notifOn = () => { try { return localStorage.getItem('kese.notify') === '1'; } catch (e) { return false; } };
function notifList() {
  const out = [], n = new Date(), at = (d, h) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, 0, 0);
  const push = (when, title, body) => { if (when > n && out.length < 40) out.push({id: 1000 + out.length, title, body, schedule: {at: when, allowWhileIdle: true}}); };
  for (let k = 0; k < 2; k++) {
    const y = new Date(n.getFullYear(), n.getMonth() + k, 1), mk = mkey(y.getFullYear(), y.getMonth());
    const paid = new Set(S.tx.filter(t => t.fixedId && t.date.slice(0, 7) === mk).map(t => t.fixedId));
    S.fixed.forEach(f => { if (paid.has(f.id)) return; const due = new Date(y.getFullYear(), y.getMonth(), Math.min(f.day, daysIn(y.getFullYear(), y.getMonth())));
      push(at(new Date(due.getFullYear(), due.getMonth(), due.getDate() - 1), 10), f.type === 'gelir' ? 'Yarın gelir günü' : 'Yarın ödeme günü', `${f.name}${f.amount > 0 ? ' · ' + money(f.amount) : ''}${f.auto && f.amount > 0 ? ' · kendiliğinden eklenecek' : ''}`); });
  }
  S.cards.forEach(c => { const pp = prevPeriod(c), due = dueAfter(pp.end, c.dueDay), amt = cardSpend(c, pp);
    if (amt > 0) push(at(new Date(due.getFullYear(), due.getMonth(), due.getDate() - 2), 10), 'Kart son ödeme günü yaklaşıyor', `${c.name} ekstresi · ${money(amt)} · 2 gün kaldı`); });
  S.debts.forEach(d => { const l = debtLeft(d); if (!l || !d.due) return; const due = parseD(d.due);
    push(at(new Date(due.getFullYear(), due.getMonth(), due.getDate() - 1), 10), 'Yarın vade günü', `${d.name} · ${money(l)}`); });
  const td = todayStr(), entered = S.tx.some(t => t.date === td && !t.fixedId);
  for (let i = entered ? 1 : 0; i < 7; i++) push(at(new Date(n.getFullYear(), n.getMonth(), n.getDate() + i), 21), 'Hesap Kitap', 'Bugünkü harcamalarını yazmak ister misin? Bir dakikanı alır.');
  return out;
}
let notifT;
function planNotifs() {
  if (!LN) return;
  clearTimeout(notifT);
  notifT = setTimeout(async () => { try {
    const pend = await LN.getPending(); if (pend && pend.notifications && pend.notifications.length) await LN.cancel({notifications: pend.notifications.map(x => ({id: x.id}))});
    if (!notifOn() || S.sample) return;
    const list = notifList(); if (list.length) await LN.schedule({notifications: list});
  } catch (e) {} }, 800);
}
async function toggleNotifs() {
  if (!LN) return;
  if (notifOn()) { try { localStorage.removeItem('kese.notify'); } catch (e) {} planNotifs(); render(); toast('Bildirimler kapatıldı'); return; }
  let ok = false; try { const r = await LN.requestPermissions(); ok = r && r.display === 'granted'; } catch (e) {}
  if (!ok) { toast('Bildirim izni verilmedi. Telefonun ayarlarından açabilirsin.'); return; }
  try { localStorage.setItem('kese.notify', '1'); } catch (e) {}
  planNotifs(); render(); toast('Bildirimler açıldı');
}

    if (b.dataset.wstart === 'blank') { if (S.sample) S = fresh(); }
    else if (!S.sample) S = Object.assign(makeSample(), {since: Date.now(), autoDone: {}});
    save(); autoFixed(); cur = {y: now0.getFullYear(), m: now0.getMonth()}; go('ozet'); buzz(10); if (!tourSeen()) showTour(); else { closeWelcome(); runLaunch(); }
  };
}
function pickPerson() {
  showWelcome(`<div class="w-hi anim">Kim<span>kullanıyor?</span></div>
    <div class="people">${PEOPLE.list.map(p => `<button class="person" data-person="${p.id}">${avatar(p)}${esc(p.name)}</button>`).join('')}
      <button class="person" data-person="new"><span class="avatar" style="background:var(--surface-2);color:var(--ink-2)">+</span>Yeni kişi</button></div>`);
  welcome.onclick = e => {
    const b = e.target.closest('[data-person]'); if (!b) return;
    try { sessionStorage.setItem('kese.picked', '1'); } catch (x) {}
    const id = b.dataset.person;
    if (id === 'new') { askName(n => { const np = {id: 'p' + uid(), name: n}; PEOPLE.list.push(np); PEOPLE.cur = np.id; savePeople(); location.reload(); }, 'Yeni kişi'); return; }
    if (id !== ME.id) { PEOPLE.cur = id; savePeople(); location.reload(); return; }
    startFor();
  };
}
const LAUNCH = ['ekle', 'yaz'].includes(location.hash.slice(1)) ? location.hash.slice(1) : '';
if (LAUNCH) history.replaceState(null, '', '#ozet');
let launched = false;
function runLaunch() {
  if (launched || !LAUNCH) return; launched = true;
  if (LAUNCH === 'ekle') openSheet();
  else { if (view !== 'ozet') go('ozet'); setTimeout(() => { const q = $('#qtext'); if (q) q.focus(); }, 50); }
}
const tourSeen = () => { try { return !!localStorage.getItem('kese.tour'); } catch (e) { return true; } };
function afterIntro() { if (!tourSeen()) showTour(); else runLaunch(); }
const TOUR = [
  {icon: 'mic', t: 'Yaz ya da söyle', p: 'Ana sayfadaki kutuya “market 450” ya da “taksi 180 dün nakit” yazman yeterli. Mikrofona söyleyebilir, + ekranından fişin fotoğrafını çekebilirsin.'},
  {icon: 'repeat', t: 'Sabit kalemler kendiliğinden gelir', p: 'Kira, faturalar, maaş… Bir kez ekle, “otomatik” işaretle; günü gelince işlensin. Yaklaşan ödemeleri ve bütçe aşımlarını ana sayfada hatırlatırız.'},
  {icon: 'target', t: 'Hedefler ve ay raporu', p: 'Birikim hedefi koy, borç-alacağını, döviz ve altınını tut. Ay bitince nereye harcadığını ve gelecek ay için önerileri raporda gör.'}
];
function showTour(i = 0) {
  const sl = TOUR[i], last = i === TOUR.length - 1;
  showWelcome(`<div class="tour-art">${svgI(sl.icon, 42)}</div><div class="w-hi anim" style="font-size:36px">${esc(sl.t)}</div><p class="w-sub">${esc(sl.p)}</p>
    <div class="tour-dots" aria-hidden="true">${TOUR.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="save-row"><button type="button" class="btn" data-tour="skip" style="flex:1">Geç</button><button type="button" class="save" data-tour="next" style="flex:2">${last ? 'Başla' : 'Devam'}</button></div>`);
  const end = () => { try { localStorage.setItem('kese.tour', '1'); } catch (e) {} closeWelcome(); runLaunch(); };
  welcome.onclick = e => { const b = e.target.closest('[data-tour]'); if (!b) return; if (b.dataset.tour === 'skip' || last) end(); else showTour(i + 1); };
  let sx = null;
  welcome.onpointerdown = e => { sx = e.clientX; };
  welcome.onpointerup = e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 60) { if (dx < 0 && !last) showTour(i + 1); else if (dx > 0 && i > 0) showTour(i - 1); } };
}
function startFor() {
  if (getPin()) { closeWelcome(false); lockNow(); return; }
  if (FRESH) askStart();
  else if (LAUNCH && tourSeen()) { closeWelcome(false); runLaunch(); }
  else greetSplash();
}
function boot() {
  let picked = null; try { picked = sessionStorage.getItem('kese.picked'); } catch (e) {}
  if (!ME.name) askName(n => {
    ME.name = n; if (!PEOPLE.list.some(x => x.id === ME.id)) PEOPLE.list.push(ME); PEOPLE.cur = ME.id; savePeople(); render();
    if (FRESH || S.sample) askStart(); else greetSplash();
  });
  else if (PEOPLE.list.length > 1 && !picked) pickPerson();
  else startFor();
}
autoFixed();
render(true);
boot();
planNotifs();
if (S.goals.some(g => g.unit && g.unit !== 'TRY') || S.assets.length) refreshRates();
})();
</script>
